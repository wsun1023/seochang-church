# Credentials are supplied by Compose environment variables.
file.upload-dir=/app/uploads/
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
catholic.http.use-windows-root=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.forward-headers-strategy=native
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.initial-admin.username=${INITIAL_ADMIN_USERNAME:}
app.initial-admin.password=${INITIAL_ADMIN_PASSWORD:}
app.initial-admin.name=${INITIAL_ADMIN_NAME:관리자}
