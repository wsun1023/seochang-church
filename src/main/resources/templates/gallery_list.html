<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>본당 갤러리 - 천주교 인천교구 서창동성당</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --primary-navy: #0F172A;
            --accent-gold: #D97706;
            --accent-gold-light: #F59E0B;
            --bg-light: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        .page-banner {
            background: linear-gradient(135deg, var(--primary-navy), #1E293B);
            color: white;
            padding: 120px 0 50px;
            margin-bottom: 40px;
            border-radius: 0 0 24px 24px;
        }

        .gallery-card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            height: 100%;
        }
        
        .gallery-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .gallery-thumbnail {
            height: 220px;
            object-fit: cover;
            width: 100%;
            background-color: #f1f5f9;
        }
        
        .gallery-thumbnail-placeholder {
            height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            color: #94a3b8;
            font-size: 2.5rem;
        }
        
        @media (max-width: 768px) {
            .page-banner {
                padding: 90px 0 30px;
                margin-bottom: 25px;
                border-radius: 0 0 16px 16px;
            }
            .gallery-thumbnail {
                height: 180px;
            }
            .gallery-thumbnail-placeholder {
                height: 180px;
            }
        }

        .gallery-card-body {
            padding: 1.25rem;
            background: white;
        }
        
        .gallery-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #0F172A;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .gallery-meta {
            font-size: 0.85rem;
            color: #64748b;
        }

        .image-count-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        footer {
            background: var(--primary-navy);
            color: #94A3B8;
            padding: 20px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<div th:replace="~{fragments/nav :: nav}"></div>

<!-- Page Banner -->
<div class="page-banner">
    <div class="container text-center">
        <h2 class="fw-bold mb-2"><i class="bi bi-images me-2" style="color: var(--accent-gold-light);"></i>본당 갤러리</h2>
        <p class="text-white-50 mb-0">우리 본당의 행사들을 사진으로 만나보세요.</p>
    </div>
</div>

<!-- Main Content -->
<main class="container">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="text-muted fw-medium">총 <span class="text-primary fw-bold" th:text="${totalElements}">0</span>개의 앨범</span>
        </div>
        <div th:if="${session.loginUser != null and session.loginUser.role == 'ADMIN'}">
            <a href="/gallery/new" class="btn btn-dark rounded-pill px-4 shadow-sm">
                <i class="bi bi-camera-fill me-1"></i> 사진 올리기
            </a>
        </div>
    </div>

    <!-- Gallery Grid -->
    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4 mb-5">
        
        <div th:if="${#lists.isEmpty(galleries)}" class="col-12 text-center py-5">
            <div class="text-muted fs-5"><i class="bi bi-camera me-2"></i>아직 등록된 사진첩이 없습니다.</div>
        </div>

        <div class="col" th:each="gallery : ${galleries}">
            <a th:href="@{/gallery/{id}(id=${gallery.id})}" class="text-decoration-none">
                <div class="card gallery-card position-relative">
                    
                    <!-- First Image Thumbnail -->
                    <th:block th:if="${gallery.attachments != null and gallery.attachments.size() > 0}">
                        <img th:src="${gallery.attachments[0].filePath}" alt="갤러리 썸네일" class="gallery-thumbnail">
                        <div class="image-count-badge">
                            <i class="bi bi-images me-1"></i> +<span th:text="${gallery.attachments.size()}">1</span>
                        </div>
                    </th:block>
                    <th:block th:unless="${gallery.attachments != null and gallery.attachments.size() > 0}">
                        <div class="gallery-thumbnail-placeholder">
                            <i class="bi bi-image"></i>
                        </div>
                    </th:block>
                    
                    <div class="gallery-card-body">
                        <h5 class="gallery-title" th:text="${gallery.title}">행사 제목</h5>
                        <div class="d-flex justify-content-between align-items-center mt-3 gallery-meta">
                            <span><i class="bi bi-calendar-event me-1"></i><span th:text="${#temporals.format(gallery.createdAt, 'yyyy-MM-dd')}">2026.07.28</span></span>
                            <span><i class="bi bi-eye me-1"></i><span th:text="${gallery.viewCount}">0</span></span>
                        </div>
                    </div>
                </div>
            </a>
        </div>
        
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" aria-label="Page navigation" class="mt-4">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link border-0 rounded-circle text-dark mx-1" th:href="@{/gallery(page=${currentPage - 1}, keyword=${keyword})}" aria-label="Previous">
                    <span aria-hidden="true"><i class="bi bi-chevron-left"></i></span>
                </a>
            </li>
            
            <li class="page-item" th:each="pageNum : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${pageNum == currentPage} ? 'active'">
                <a class="page-link border-0 rounded-circle mx-1 fw-medium shadow-sm"
                   th:classappend="${pageNum == currentPage} ? 'bg-primary text-white' : 'text-dark bg-light'"
                   th:href="@{/gallery(page=${pageNum}, keyword=${keyword})}" th:text="${pageNum + 1}">1</a>
            </li>
            
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link border-0 rounded-circle text-dark mx-1" th:href="@{/gallery(page=${currentPage + 1}, keyword=${keyword})}" aria-label="Next">
                    <span aria-hidden="true"><i class="bi bi-chevron-right"></i></span>
                </a>
            </li>
        </ul>
    </nav>
    
</main>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <p class="mb-0 text-nowrap" style="font-size: 0.75rem;">Copyright © 2026 천주교 서창동성당. All Rights Reserved.</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
