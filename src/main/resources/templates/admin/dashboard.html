<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<head><title>대시보드</title></head>
<body>
<div th:fragment="content">
    <h2><i class="bi bi-speedometer2"></i> 관리자 대시보드</h2>
    <hr>
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3 shadow">
                <div class="card-header">회원 관리</div>
                <div class="card-body">
                    <h5 class="card-title">가입 대기 및 유저 현황</h5>
                    <p class="card-text">새로 가입한 회원을 승인하거나 권한을 부여하세요.</p>
                    <a href="/admin/users" class="btn btn-light btn-sm mt-2">회원 관리 바로가기</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3 shadow">
                <div class="card-header">게시글 관리</div>
                <div class="card-body">
                    <h5 class="card-title">통합 게시물 리스트</h5>
                    <p class="card-text">부적절한 게시물을 확인하고 강제 삭제할 수 있습니다.</p>
                    <a href="/admin/boards" class="btn btn-light btn-sm mt-2">게시글 관리 바로가기</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
