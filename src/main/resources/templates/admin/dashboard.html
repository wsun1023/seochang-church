<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<head><title>대시보드</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <h2 class="page-title"><i class="bi bi-grid-1x2-fill text-warning me-2"></i> 관리자 대시보드</h2>
        <div class="text-muted small">오늘 날짜: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy년 MM월 dd일')}"></span></div>
    </div>
    
    <!-- Stats Widgets -->
    <div class="row g-4 mb-4">
        <div class="col-md-6 col-lg-3">
            <div class="admin-card text-center position-relative overflow-hidden" style="border-left: 4px solid var(--primary-navy);">
                <div class="position-absolute top-0 end-0 opacity-10 p-3">
                    <i class="bi bi-people-fill" style="font-size: 4rem;"></i>
                </div>
                <h6 class="text-muted fw-bold mb-3">총 회원 수</h6>
                <h3 class="display-6 fw-bold text-dark mb-0"><span th:text="${totalUsers}">0</span><span class="fs-6 text-muted ms-1">명</span></h3>
                <div class="mt-3">
                    <span th:if="${pendingUsers > 0}" class="badge bg-danger rounded-pill px-3">승인 대기 <span th:text="${pendingUsers}"></span>명</span>
                    <span th:unless="${pendingUsers > 0}" class="badge bg-success rounded-pill px-3">모두 승인됨</span>
                </div>
            </div>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <div class="admin-card text-center position-relative overflow-hidden" style="border-left: 4px solid #3B82F6;">
                <div class="position-absolute top-0 end-0 opacity-10 p-3">
                    <i class="bi bi-chat-square-text-fill" style="font-size: 4rem;"></i>
                </div>
                <h6 class="text-muted fw-bold mb-3">자유게시판 글</h6>
                <h3 class="display-6 fw-bold text-dark mb-0"><span th:text="${totalBoards}">0</span><span class="fs-6 text-muted ms-1">개</span></h3>
                <a href="/admin/boards" class="btn btn-sm btn-outline-primary mt-3 rounded-pill px-3">게시판 관리</a>
            </div>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <div class="admin-card text-center position-relative overflow-hidden" style="border-left: 4px solid #10B981;">
                <div class="position-absolute top-0 end-0 opacity-10 p-3">
                    <i class="bi bi-megaphone-fill" style="font-size: 4rem;"></i>
                </div>
                <h6 class="text-muted fw-bold mb-3">성당소식 글</h6>
                <h3 class="display-6 fw-bold text-dark mb-0"><span th:text="${totalNotices}">0</span><span class="fs-6 text-muted ms-1">개</span></h3>
                <a href="/admin/notices" class="btn btn-sm btn-outline-success mt-3 rounded-pill px-3">소식 관리</a>
            </div>
        </div>
        
        <div class="col-md-6 col-lg-3">
            <div class="admin-card text-center position-relative overflow-hidden" style="border-left: 4px solid #8B5CF6;">
                <div class="position-absolute top-0 end-0 opacity-10 p-3">
                    <i class="bi bi-images" style="font-size: 4rem;"></i>
                </div>
                <h6 class="text-muted fw-bold mb-3">갤러리 사진첩</h6>
                <h3 class="display-6 fw-bold text-dark mb-0"><span th:text="${totalGalleries}">0</span><span class="fs-6 text-muted ms-1">개</span></h3>
                <a href="/admin/galleries" class="btn btn-sm btn-outline-danger mt-3 rounded-pill px-3" style="color: #8B5CF6; border-color: #8B5CF6;">갤러리 관리</a>
            </div>
        </div>
    </div>
    
    <!-- Recent Activity Tables -->
    <div class="row g-4">
        <div class="col-lg-12">
            <div class="admin-card p-md-4 p-3 bg-transparent bg-md-white border-0 border-md shadow-none shadow-md-sm">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h5 class="fw-bold m-0">최근 가입 회원 목록</h5>
                    <a href="/admin/users" class="btn btn-sm btn-light">전체보기</a>
                </div>
                
                <div class="table-responsive d-none d-md-block bg-white rounded-3 border overflow-hidden">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>이름 (세례명)</th>
                                <th>아이디</th>
                                <th>가입일</th>
                                <th>권한</th>
                                <th>상태</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${recentUsers}">
                                <td>
                                    <span class="fw-bold text-dark" th:text="${user.name}">홍길동</span>
                                    <span class="text-muted ms-1" th:text="'(' + ${user.baptismalName} + ')'">(세례명)</span>
                                </td>
                                <td th:text="${user.username}">user123</td>
                                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-28</td>
                                <td>
                                    <span class="badge bg-primary" th:if="${user.role == 'ADMIN'}">관리자</span>
                                    <span class="badge bg-secondary" th:if="${user.role == 'USER'}">일반회원</span>
                                </td>
                                <td>
                                    <span class="badge bg-success" th:if="${user.isApproved}">승인됨</span>
                                    <span class="badge bg-danger" th:unless="${user.isApproved}">대기중</span>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(recentUsers)}">
                                <td colspan="5" class="text-center py-4 text-muted">최근 가입한 회원이 없습니다.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Mobile Card View -->
                <div class="d-block d-md-none">
                    <div th:each="user : ${recentUsers}" class="card mb-3 border-0 shadow-sm rounded-4">
                        <div class="card-body p-3">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h6 class="mb-0 fw-bold d-inline-block">
                                        <span th:text="${user.name}">홍길동</span>
                                    </h6>
                                    <span class="text-muted small ms-1" th:text="'(' + ${user.baptismalName} + ')'">(세례명)</span>
                                    <div class="text-muted small mt-1"><i class="bi bi-person-badge me-1"></i><span th:text="${user.username}">아이디</span></div>
                                </div>
                                <div>
                                    <span class="badge bg-success" th:if="${user.isApproved}">승인됨</span>
                                    <span class="badge bg-danger" th:unless="${user.isApproved}">대기중</span>
                                </div>
                            </div>
                            
                            <div class="d-flex justify-content-between align-items-end mt-2 pt-2 border-top">
                                <span class="badge bg-primary" th:if="${user.role == 'ADMIN'}">관리자</span>
                                <span class="badge bg-secondary" th:if="${user.role == 'USER'}">일반회원</span>
                                <span class="text-muted small" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">2026-07-28</span>
                            </div>
                        </div>
                    </div>
                    
                    <div th:if="${#lists.isEmpty(recentUsers)}" class="text-center py-5 text-muted bg-white rounded-4 shadow-sm border-0">
                        <i class="bi bi-person-x fs-1 d-block mb-3 opacity-50"></i>
                        최근 가입한 회원이 없습니다.
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
