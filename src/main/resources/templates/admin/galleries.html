<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<head><title>갤러리 관리</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <h2 class="page-title"><i class="bi bi-images text-danger me-2" style="color: #8B5CF6 !important;"></i> 갤러리 사진첩 관리</h2>
    </div>
    
    <div class="admin-card p-md-4 p-2 bg-transparent bg-md-white border-0 border-md shadow-none shadow-md-sm">
        <!-- Desktop Table View -->
        <div class="table-responsive d-none d-md-block bg-white rounded-3 border overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="py-3 text-center" style="width: 80px;">번호</th>
                        <th class="py-3 text-center" style="width: 100px;">대표이미지</th>
                        <th class="py-3">제목</th>
                        <th class="py-3 text-center" style="width: 180px;">작성자</th>
                        <th class="py-3 text-center" style="width: 150px;">작성일</th>
                        <th class="py-3 text-center" style="width: 100px;">조회수</th>
                        <th class="py-3 text-center" style="width: 100px;">상태</th>
                        <th class="py-3 text-center" style="width: 100px;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="gallery : ${galleries}" th:classappend="${gallery.delYn == 'Y'} ? 'opacity-50' : ''">
                        <td class="text-center text-muted" th:text="${gallery.id}">1</td>
                        <td class="text-center">
                            <div style="width: 60px; height: 40px; background-color: #f1f5f9; border-radius: 4px; overflow: hidden; margin: 0 auto;">
                                <img th:if="${gallery.attachments != null and not #lists.isEmpty(gallery.attachments) and gallery.attachments[0].image}" 
                                     th:src="${gallery.attachments[0].filePath}" style="width: 100%; height: 100%; object-fit: cover;">
                                <i th:unless="${gallery.attachments != null and not #lists.isEmpty(gallery.attachments) and gallery.attachments[0].image}" 
                                   class="bi bi-image text-muted d-flex align-items-center justify-content-center h-100"></i>
                            </div>
                        </td>
                        <td>
                            <a th:if="${gallery.delYn == 'N'}" th:href="@{/gallery/{id}(id=${gallery.id})}" th:text="${gallery.title}" target="_blank" class="text-dark text-decoration-none fw-bold">제목</a>
                            <span th:if="${gallery.delYn == 'Y'}" th:text="${gallery.title}" class="text-decoration-line-through">제목</span>
                        </td>
                        <td class="text-center" th:text="${gallery.writer}">작성자</td>
                        <td class="text-center text-muted small" th:text="${#temporals.format(gallery.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                        <td class="text-center text-muted small" th:text="${gallery.viewCount}">0</td>
                        <td class="text-center">
                            <span th:if="${gallery.delYn == 'N'}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2">정상</span>
                            <span th:if="${gallery.delYn == 'Y'}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 px-2">삭제됨</span>
                        </td>
                        <td class="text-center">
                            <form th:if="${gallery.delYn == 'N'}" th:action="@{/admin/galleries/{id}/delete(id=${gallery.id})}" method="post" onsubmit="return confirm('이 갤러리 게시글을 정말 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-2"><i class="bi bi-trash"></i> 삭제</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(galleries)}">
                        <td colspan="8" class="text-center py-5 text-muted">
                            <i class="bi bi-images fs-1 d-block mb-3 opacity-50"></i>
                            등록된 갤러리 사진첩이 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Mobile Card View -->
        <div class="d-block d-md-none">
            <div th:each="gallery : ${galleries}" class="card mb-3 border-0 shadow-sm rounded-4" th:classappend="${gallery.delYn == 'Y'} ? 'opacity-50' : ''">
                <div class="card-body p-3 d-flex gap-3">
                    <!-- Image -->
                    <div style="width: 80px; height: 80px; background-color: #f1f5f9; border-radius: 8px; flex-shrink: 0; overflow: hidden;">
                        <img th:if="${gallery.attachments != null and not #lists.isEmpty(gallery.attachments) and gallery.attachments[0].image}" 
                             th:src="${gallery.attachments[0].filePath}" style="width: 100%; height: 100%; object-fit: cover;">
                        <i th:unless="${gallery.attachments != null and not #lists.isEmpty(gallery.attachments) and gallery.attachments[0].image}" 
                           class="bi bi-image text-muted d-flex align-items-center justify-content-center h-100 fs-3"></i>
                    </div>
                    
                    <!-- Content -->
                    <div class="flex-grow-1 d-flex flex-column justify-content-center">
                        <div class="d-flex justify-content-between align-items-start mb-1">
                            <h6 class="mb-0 fw-bold text-truncate" style="max-width: 150px;">
                                <a th:if="${gallery.delYn == 'N'}" th:href="@{/gallery/{id}(id=${gallery.id})}" th:text="${gallery.title}" target="_blank" class="text-dark text-decoration-none">제목</a>
                                <span th:if="${gallery.delYn == 'Y'}" th:text="${gallery.title}" class="text-decoration-line-through text-muted">제목</span>
                            </h6>
                            <span th:if="${gallery.delYn == 'N'}" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 ms-1" style="font-size: 0.7rem;">정상</span>
                            <span th:if="${gallery.delYn == 'Y'}" class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25 ms-1" style="font-size: 0.7rem;">삭제됨</span>
                        </div>
                        <p class="text-muted small mb-2 text-truncate" style="max-width: 180px;"><i class="bi bi-person me-1"></i><span th:text="${gallery.writer}">작성자</span></p>
                        
                        <div class="text-end mt-auto">
                            <form th:if="${gallery.delYn == 'N'}" th:action="@{/admin/galleries/{id}/delete(id=${gallery.id})}" method="post" onsubmit="return confirm('이 갤러리 게시글을 정말 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-3 rounded-pill" style="font-size: 0.8rem;"><i class="bi bi-trash"></i> 삭제</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(galleries)}" class="text-center py-5 text-muted bg-white rounded-4 shadow-sm border-0">
                <i class="bi bi-images fs-1 d-block mb-3 opacity-50"></i>
                등록된 갤러리 사진첩이 없습니다.
            </div>
        </div>
    </div>

    <!-- 페이징 -->
    <nav class="mt-4" th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/admin/galleries(page=${currentPage - 1})}"><i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link border-0 rounded-circle mx-1" th:classappend="${i == currentPage} ? 'bg-primary text-white' : 'text-dark'" th:href="@{/admin/galleries(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/admin/galleries(page=${currentPage + 1})}"><i class="bi bi-chevron-right"></i></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
