<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<head><title>게시글 관리</title></head>
<body>
<div th:fragment="content">
    <h2 class="mb-4"><i class="bi bi-file-earmark-text"></i> 게시글 통합 관리</h2>
    
    <div class="table-responsive bg-white rounded shadow-sm p-3">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>분류</th>
                    <th>카테고리</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>작성일</th>
                    <th>상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="board : ${boards}" th:classappend="${board.delYn == 'Y'} ? 'table-secondary text-muted' : ''">
                    <td th:text="${board.id}">1</td>
                    <td>게시판</td>
                    <td th:text="${board.category}">카테고리</td>
                    <td>
                        <a th:if="${board.delYn == 'N'}" th:href="@{/boards/{id}(id=${board.id})}" th:text="${board.title}" target="_blank">제목</a>
                        <span th:if="${board.delYn == 'Y'}" th:text="${board.title}">제목</span>
                    </td>
                    <td th:text="${board.writer}">작성자</td>
                    <td th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01</td>
                    <td>
                        <span th:if="${board.delYn == 'N'}" class="badge bg-success">정상</span>
                        <span th:if="${board.delYn == 'Y'}" class="badge bg-secondary">삭제됨</span>
                    </td>
                    <td>
                        <form th:if="${board.delYn == 'N'}" th:action="@{/admin/boards/{id}/delete(id=${board.id})}" method="post" onsubmit="return confirm('이 게시글을 삭제하시겠습니까?');">
                            <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(boards)}">
                    <td colspan="8" class="text-center py-4">등록된 게시글이 없습니다.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- 페이징 -->
    <nav class="mt-4" th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/boards(page=${currentPage - 1})}">이전</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/admin/boards(page=${i})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/boards(page=${currentPage + 1})}">다음</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
