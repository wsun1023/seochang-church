<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<head><title>팝업 및 배너 관리</title></head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <h2 class="page-title"><i class="bi bi-aspect-ratio-fill text-info me-2"></i> 팝업 및 배너 관리</h2>
        <button class="btn btn-primary rounded-pill" data-bs-toggle="modal" data-bs-target="#addBannerModal"><i class="bi bi-plus-lg"></i> 새 배너 등록</button>
    </div>
    
    <div class="admin-card p-md-4 p-2 bg-transparent bg-md-white border-0 border-md shadow-none shadow-md-sm">
        <div class="table-responsive d-none d-md-block bg-white rounded-3 border overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="py-3 text-center" style="width: 80px;">상태</th>
                        <th class="py-3 text-center" style="width: 80px;">구분</th>
                        <th class="py-3 text-center" style="width: 150px;">이미지</th>
                        <th class="py-3">제목 및 링크</th>
                        <th class="py-3 text-center" style="width: 200px;">게시 기간</th>
                        <th class="py-3 text-center" style="width: 100px;">On/Off</th>
                        <th class="py-3 text-center" style="width: 110px;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="banner : ${banners}" th:classappend="${!banner.active} ? 'opacity-50' : ''">
                        <td class="text-center">
                            <span th:if="${banner.active and banner.currentlyDisplayable}" class="badge bg-success">노출중</span>
                            <span th:if="${banner.active and !banner.currentlyDisplayable}" class="badge bg-warning text-dark">기간만료/대기</span>
                            <span th:unless="${banner.active}" class="badge bg-secondary">숨김</span>
                        </td>
                        <td class="text-center">
                            <span th:if="${banner.type == 'POPUP'}" class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 px-2">팝업</span>
                            <span th:if="${banner.type == 'BANNER'}" class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-2">배너</span>
                        </td>
                        <td class="text-center">
                            <div style="width: 120px; height: 60px; background-color: #f1f5f9; border-radius: 6px; overflow: hidden; margin: 0 auto;">
                                <img th:src="${banner.imageUrl}" style="width: 100%; height: 100%; object-fit: contain;">
                            </div>
                        </td>
                        <td>
                            <div class="fw-bold text-dark">
                                <span class="badge bg-secondary bg-opacity-75 me-1 fw-normal" th:text="${'우선순위: ' + (banner.priority != null ? banner.priority : 0)}">우선순위: 0</span>
                                <span th:text="${banner.title}">배너 제목</span>
                            </div>
                            <div class="small text-muted text-truncate" style="max-width: 250px;">
                                <a th:if="${banner.linkUrl != null and !banner.linkUrl.isEmpty()}" th:href="${banner.linkUrl}" target="_blank" class="text-decoration-none">
                                    <i class="bi bi-link-45deg"></i> <span th:text="${banner.linkUrl}"></span>
                                </a>
                                <span th:unless="${banner.linkUrl != null and !banner.linkUrl.isEmpty()}">링크 없음</span>
                            </div>
                        </td>
                        <td class="text-center small">
                            <div th:if="${banner.startDate == null and banner.endDate == null}" class="text-muted">상시 노출</div>
                            <div th:unless="${banner.startDate == null and banner.endDate == null}">
                                <span th:text="${banner.startDate != null ? #temporals.format(banner.startDate, 'yyyy-MM-dd') : '제한없음'}"></span>
                                <br>~ <span th:text="${banner.endDate != null ? #temporals.format(banner.endDate, 'yyyy-MM-dd') : '제한없음'}"></span>
                            </div>
                        </td>
                        <td class="text-center">
                            <form th:action="@{/admin/banners/{id}/toggle(id=${banner.id})}" method="post">
                                <div class="form-check form-switch d-flex justify-content-center m-0">
                                    <input class="form-check-input" type="checkbox" onchange="this.form.submit()" th:checked="${banner.active}" style="cursor: pointer;">
                                </div>
                            </form>
                        </td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-1">
                                <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2"
                                        th:data-id="${banner.id}"
                                        th:data-title="${banner.title}"
                                        th:data-type="${banner.type}"
                                        th:data-linkurl="${banner.linkUrl}"
                                        th:data-startdate="${banner.startDate}"
                                        th:data-enddate="${banner.endDate}"
                                        th:data-priority="${banner.priority}"
                                        th:data-active="${banner.active}"
                                        th:data-imageurl="${banner.imageUrl}"
                                        onclick="openEditBannerModal(this)"
                                        title="수정">
                                    <i class="bi bi-pencil"></i>
                                </button>
                                <form th:action="@{/admin/banners/{id}/delete(id=${banner.id})}" method="post" onsubmit="return confirm('이 배너를 정말 삭제하시겠습니까?');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-2" title="삭제"><i class="bi bi-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(banners)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="bi bi-aspect-ratio fs-1 d-block mb-3 opacity-50"></i>
                            등록된 팝업이나 배너가 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Mobile Card View -->
        <div class="d-block d-md-none">
            <div th:each="banner : ${banners}" class="card mb-3 border-0 shadow-sm rounded-4" th:classappend="${!banner.active} ? 'opacity-50' : ''">
                <div class="card-body p-3 d-flex flex-column gap-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <span th:if="${banner.type == 'POPUP'}" class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 px-2">팝업</span>
                            <span th:if="${banner.type == 'BANNER'}" class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-2">배너</span>
                            <span th:if="${banner.active and banner.currentlyDisplayable}" class="badge bg-success ms-1">노출중</span>
                            <span th:if="${banner.active and !banner.currentlyDisplayable}" class="badge bg-warning text-dark ms-1">기간만료/대기</span>
                            <span th:unless="${banner.active}" class="badge bg-secondary ms-1">숨김</span>
                        </div>
                        <form th:action="@{/admin/banners/{id}/toggle(id=${banner.id})}" method="post">
                            <div class="form-check form-switch m-0 p-0 d-flex align-items-center">
                                <input class="form-check-input m-0 ms-2" type="checkbox" onchange="this.form.submit()" th:checked="${banner.active}" style="cursor: pointer; width: 2.5em; height: 1.25em;">
                            </div>
                        </form>
                    </div>
                    
                    <div class="d-flex gap-3 align-items-center bg-light rounded-3 p-2 border">
                        <div style="width: 100px; height: 60px; flex-shrink: 0; background-color: #f1f5f9; border-radius: 4px; overflow: hidden;">
                            <img th:src="${banner.imageUrl}" style="width: 100%; height: 100%; object-fit: contain;">
                        </div>
                        <div class="flex-grow-1 overflow-hidden">
                            <h6 class="fw-bold mb-1 text-truncate">
                                <span class="badge bg-secondary bg-opacity-75 me-1 fw-normal" th:text="${'우선순위: ' + (banner.priority != null ? banner.priority : 0)}">우선순위: 0</span>
                                <span th:text="${banner.title}">배너 제목</span>
                            </h6>
                            <div class="small text-muted text-truncate">
                                <a th:if="${banner.linkUrl != null and !banner.linkUrl.isEmpty()}" th:href="${banner.linkUrl}" target="_blank" class="text-decoration-none">
                                    <i class="bi bi-link-45deg"></i> <span th:text="${banner.linkUrl}"></span>
                                </a>
                                <span th:unless="${banner.linkUrl != null and !banner.linkUrl.isEmpty()}">링크 없음</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-center border-top pt-2">
                        <div class="small text-muted">
                            <div th:if="${banner.startDate == null and banner.endDate == null}"><i class="bi bi-calendar-event me-1"></i>상시 노출</div>
                            <div th:unless="${banner.startDate == null and banner.endDate == null}">
                                <i class="bi bi-calendar-range me-1"></i>
                                <span th:text="${banner.startDate != null ? #temporals.format(banner.startDate, 'yy.MM.dd') : '제한없음'}"></span>
                                ~ <span th:text="${banner.endDate != null ? #temporals.format(banner.endDate, 'yy.MM.dd') : '제한없음'}"></span>
                            </div>
                        </div>
                        <div class="d-flex gap-1">
                            <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3 py-1" style="font-size: 0.8rem;"
                                    th:data-id="${banner.id}"
                                    th:data-title="${banner.title}"
                                    th:data-type="${banner.type}"
                                    th:data-linkurl="${banner.linkUrl}"
                                    th:data-startdate="${banner.startDate}"
                                    th:data-enddate="${banner.endDate}"
                                    th:data-priority="${banner.priority}"
                                    th:data-active="${banner.active}"
                                    th:data-imageurl="${banner.imageUrl}"
                                    onclick="openEditBannerModal(this)">
                                <i class="bi bi-pencil"></i> 수정
                            </button>
                            <form th:action="@{/admin/banners/{id}/delete(id=${banner.id})}" method="post" onsubmit="return confirm('이 배너를 정말 삭제하시겠습니까?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-3 py-1" style="font-size: 0.8rem;"><i class="bi bi-trash"></i> 삭제</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(banners)}" class="text-center py-5 text-muted bg-white rounded-4 shadow-sm border-0">
                <i class="bi bi-aspect-ratio fs-1 d-block mb-3 opacity-50"></i>
                등록된 팝업이나 배너가 없습니다.
            </div>
        </div>
    </div>

    <!-- Modal for Adding Banner -->
    <div class="modal fade" id="addBannerModal" tabindex="-1" aria-labelledby="addBannerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom bg-light">
                    <h5 class="modal-title fw-bold" id="addBannerModalLabel">새 팝업/배너 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form action="/admin/banners/add" method="post" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">구분</label>
                            <select class="form-select" name="type" required>
                                <option value="BANNER">메인 배너 (슬라이드형)</option>
                                <option value="POPUP">메인 팝업 (모달창)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">제목 (관리용)</label>
                            <input type="text" class="form-control" name="title" required placeholder="배너 제목을 입력하세요">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">우선순위 <span class="small text-muted fw-normal">(숫자가 작을수록 먼저 표시됩니다. 기본값: 0)</span></label>
                            <input type="number" class="form-control" name="priority" value="0" required placeholder="예: 1, 2, 3...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">이미지 파일 (필수)</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">링크 주소 (선택)</label>
                            <input type="text" class="form-control" name="linkUrl" placeholder="클릭 시 이동할 URL (https://...)">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold text-muted small">게시 시작일 (선택)</label>
                                <input type="date" class="form-control form-control-sm" name="startDate">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold text-muted small">게시 종료일 (선택)</label>
                                <input type="date" class="form-control form-control-sm" name="endDate">
                            </div>
                        </div>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" name="active" id="activeCheck" value="true" checked>
                            <label class="form-check-label fw-bold text-primary" for="activeCheck">등록 즉시 활성화하기</label>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0 px-4 pb-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">등록하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal for Editing Banner -->
    <div class="modal fade" id="editBannerModal" tabindex="-1" aria-labelledby="editBannerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header border-bottom bg-light">
                    <h5 class="modal-title fw-bold" id="editBannerModalLabel">팝업/배너 수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editBannerForm" method="post" enctype="multipart/form-data">
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">구분</label>
                            <select class="form-select" name="type" id="editType" required>
                                <option value="BANNER">메인 배너 (슬라이드형)</option>
                                <option value="POPUP">메인 팝업 (모달창)</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">제목 (관리용)</label>
                            <input type="text" class="form-control" name="title" id="editTitle" required placeholder="배너 제목을 입력하세요">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">우선순위 <span class="small text-muted fw-normal">(숫자가 작을수록 먼저 표시됩니다. 기본값: 0)</span></label>
                            <input type="number" class="form-control" name="priority" id="editPriority" value="0" required placeholder="예: 1, 2, 3...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">이미지 파일 (변경 시만 첨부)</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*">
                            <div class="form-text small text-muted mt-1" id="currentImageText"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">링크 주소 (선택)</label>
                            <input type="text" class="form-control" name="linkUrl" id="editLinkUrl" placeholder="클릭 시 이동할 URL (https://...)">
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold text-muted small">게시 시작일 (선택)</label>
                                <input type="date" class="form-control form-control-sm" name="startDate" id="editStartDate">
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold text-muted small">게시 종료일 (선택)</label>
                                <input type="date" class="form-control form-control-sm" name="endDate" id="editEndDate">
                            </div>
                        </div>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" name="active" id="editActiveCheck" value="true">
                            <label class="form-check-label fw-bold text-primary" for="editActiveCheck">활성화하기</label>
                        </div>
                    </div>
                    <div class="modal-footer border-top-0 pt-0 px-4 pb-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">취소</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4">수정 저장</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openEditBannerModal(btn) {
            const id = btn.getAttribute('data-id');
            const title = btn.getAttribute('data-title');
            const type = btn.getAttribute('data-type');
            const linkUrl = btn.getAttribute('data-linkurl');
            const startDate = btn.getAttribute('data-startdate');
            const endDate = btn.getAttribute('data-enddate');
            const priority = btn.getAttribute('data-priority');
            const active = btn.getAttribute('data-active') === 'true';
            const imageUrl = btn.getAttribute('data-imageurl');

            document.getElementById('editBannerForm').action = '/admin/banners/' + id + '/edit';
            document.getElementById('editTitle').value = title || '';
            document.getElementById('editPriority').value = priority || 0;
            document.getElementById('editType').value = type || 'BANNER';
            document.getElementById('editLinkUrl').value = linkUrl || '';
            document.getElementById('editStartDate').value = startDate || '';
            document.getElementById('editEndDate').value = endDate || '';
            document.getElementById('editActiveCheck').checked = active;

            const imageText = document.getElementById('currentImageText');
            if (imageUrl) {
                imageText.innerText = '현재 등록된 이미지: ' + imageUrl;
            } else {
                imageText.innerText = '';
            }

            const modal = new bootstrap.Modal(document.getElementById('editBannerModal'));
            modal.show();
        }
    </script>
</div>
</body>
</html>
