<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 - 서창동성당</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
<meta name="csrf-token" th:content="${csrfToken}">
<script src="/js/csrf.js"></script>
</head>
<body class="admin-ui" th:with="adminPath=${requestURI != null ? requestURI : (profileAction != null ? profileAction : '/admin')}">
    <!-- Mobile Header (Visible only on < lg screens) -->
    <header class="admin-mobile-header d-lg-none">
        <a href="/admin" class="admin-mobile-brand"><i class="bi bi-shield-check" aria-hidden="true"></i>서창동성당 <span>관리자</span></a>
        <button class="btn btn-outline-light border-0" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminSidebar" aria-controls="adminSidebar" aria-label="관리 메뉴 열기">
            <i class="bi bi-list fs-4"></i>
        </button>
    </header>

    <div class="admin-shell">
            <!-- Sidebar (Offcanvas on mobile, static col-lg-2 on desktop) -->
            <aside class="sidebar d-flex flex-column offcanvas-lg offcanvas-start" tabindex="-1" id="adminSidebar" aria-labelledby="adminSidebarLabel">
                <div class="offcanvas-header d-lg-none border-bottom border-secondary border-opacity-25 pb-3 mb-2 px-4 pt-4">
                    <h5 class="offcanvas-title fw-bold text-white" id="adminSidebarLabel"><i class="bi bi-shield-lock-fill text-warning me-2"></i>관리자 메뉴</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#adminSidebar" aria-label="관리 메뉴 닫기"></button>
                </div>
                
                <div class="sidebar-header d-none d-lg-block">
                    <a href="/admin" class="admin-brand"><span class="admin-brand-icon"><i class="bi bi-shield-check" aria-hidden="true"></i></span><span>서창동성당<small>관리자 센터</small></span></a>
                </div>
                
                <nav class="sidebar-menu" aria-label="관리자 메뉴">
                    <!-- Helper variables to set active class -->
                    <p class="sidebar-group-label">운영 현황</p>
                    <a href="/admin" th:classappend="${adminPath == '/admin' ? 'active' : ''}" th:attr="aria-current=${adminPath == '/admin' ? 'page' : null}">
                        <i class="bi bi-grid-1x2-fill"></i> 대시보드
                    </a>
                    <a href="/admin/users" th:classappend="${#strings.startsWith(adminPath, '/admin/users') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(adminPath, '/admin/users') ? 'page' : null}">
                        <i class="bi bi-people-fill"></i> 회원 관리
                    </a>
                    <p class="sidebar-group-label">콘텐츠 관리</p>
                    <a href="/admin/boards" th:classappend="${#strings.startsWith(adminPath, '/admin/boards') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(adminPath, '/admin/boards') ? 'page' : null}">
                        <i class="bi bi-chat-square-text-fill"></i> 자유게시판 관리
                    </a>
                    <a href="/admin/notices" th:classappend="${#strings.startsWith(adminPath, '/admin/notices') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(adminPath, '/admin/notices') ? 'page' : null}">
                        <i class="bi bi-megaphone-fill"></i> 성당소식 관리
                    </a>
                    <a href="/admin/galleries" th:classappend="${#strings.startsWith(adminPath, '/admin/galleries') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(adminPath, '/admin/galleries') ? 'page' : null}">
                        <i class="bi bi-images"></i> 갤러리 관리
                    </a>
                    <a href="/admin/banners" th:classappend="${#strings.startsWith(adminPath, '/admin/banners') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(adminPath, '/admin/banners') ? 'page' : null}">
                        <i class="bi bi-aspect-ratio-fill"></i> 팝업/배너 관리
                    </a>
                    <a href="/admin/calendar" th:classappend="${#strings.startsWith(adminPath, '/admin/calendar') ? 'active' : ''}" th:attr="aria-current=${#strings.startsWith(adminPath, '/admin/calendar') ? 'page' : null}">
                        <i class="bi bi-calendar-event-fill"></i> 일정 관리
                    </a>
                    <p class="sidebar-group-label">내 계정</p>
                    <a href="/admin/profile" th:classappend="${adminPath == '/admin/profile' ? 'active' : ''}" th:attr="aria-current=${adminPath == '/admin/profile' ? 'page' : null}"><i class="bi bi-person-gear"></i> 내 회원정보 수정</a>
                </nav>
                
                <div class="sidebar-footer">
                    <a href="/"><i class="bi bi-house-door-fill me-1"></i> 성당 홈으로 가기</a>
                    <p class="sidebar-footnote">SEOCHANG PARISH</p>
                </div>
            </aside>
            
            <!-- Main Content -->
            <main class="admin-content" id="adminMain">
                <header class="admin-topbar">
                    <a href="/admin" class="admin-topbar-label"><span class="admin-live-dot" aria-hidden="true"></span>관리자 센터</a>
                    <div class="admin-topbar-actions">
                        <span th:replace="~{fragments/notification_link :: link}"></span>
                        <a href="/admin/profile" class="admin-account-link" th:if="${session.loginUser != null}"><i class="bi bi-person-circle" aria-hidden="true"></i><span th:text="${session.loginUser.displayName}">관리자</span><span class="visually-hidden">회원정보 수정</span></a>
                        <form th:action="@{/logout}" method="post"><input type="hidden" name="_csrf" th:value="${csrfToken}"><button type="submit" class="admin-logout" aria-label="로그아웃" title="로그아웃"><i class="bi bi-box-arrow-right" aria-hidden="true"></i></button></form>
                    </div>
                </header>
                <div class="admin-workspace"><div th:replace="${content}"></div></div>
            </main>
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
