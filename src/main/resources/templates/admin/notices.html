<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<head><title>성당소식 관리</title><meta name="csrf-token" th:content="${csrfToken}">
<script src="/js/csrf.js"></script>
</head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <h2 class="page-title"><i class="bi bi-megaphone-fill text-success me-2"></i> 성당소식 관리</h2>
        
        <!-- 검색 폼 -->
        <form class="d-flex" action="/admin/notices" method="get" style="width: 300px;">
            <div class="input-group">
                <input class="form-control" type="search" name="keyword" placeholder="제목 또는 작성자 검색" aria-label="Search" th:value="${keyword}">
                <button class="btn btn-outline-secondary bg-white" type="submit"><i class="bi bi-search"></i></button>
            </div>
        </form>
    </div>
    
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show mb-3" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${message}">성공 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div class="admin-card p-md-4 p-2 bg-transparent bg-md-white border-0 border-md shadow-none shadow-md-sm">
        <!-- Desktop Table View -->
        <div class="table-responsive d-none d-md-block bg-white rounded-3 border overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="py-3 text-center" style="width: 80px;">번호</th>
                        <th class="py-3">제목</th>
                        <th class="py-3 text-center" style="width: 180px;">작성자</th>
                        <th class="py-3 text-center" style="width: 150px;">작성일</th>
                        <th class="py-3 text-center" style="width: 100px;">조회수</th>
                        <th class="py-3 text-center" style="width: 100px;">상태</th>
                        <th class="py-3 text-center" style="width: 100px;">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="notice : ${notices}" th:classappend="${notice.pinned} ? 'table-warning bg-opacity-25' : ''">
                        <td class="text-center text-muted" th:text="${notice.id}">1</td>
                        <td>
                            <span th:if="${notice.pinned}" class="badge bg-danger text-white me-1"><i class="bi bi-pin-angle-fill"></i> 고정</span>
                            <a th:href="@{/notices/{id}(id=${notice.id})}" th:text="${notice.title}" target="_blank" class="text-dark text-decoration-none fw-bold">제목</a>
                            <span th:if="${notice.attachments != null and not #lists.isEmpty(notice.attachments)}" class="badge bg-light text-dark border ms-1"><i class="bi bi-paperclip"></i></span>
                        </td>
                        <td class="text-center">관리자</td>
                        <td class="text-center text-muted small" th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
                        <td class="text-center text-muted small" th:text="${notice.viewCount}">0</td>
                        <td class="text-center">
                            <span th:if="${notice.pinned}" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 px-2 mb-1 d-block"><i class="bi bi-pin-angle-fill"></i> 상단고정</span>
                            <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 px-2">정상</span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-1">
                                <form th:action="@{/admin/notices/{id}/toggle-pin(id=${notice.id}, page=${currentPage}, keyword=${keyword})}" method="post">
                                    <input type="hidden" name="_csrf" th:value="${csrfToken}">
                                    <button type="submit" class="btn btn-sm py-1 px-2" th:classappend="${notice.pinned} ? 'btn-warning text-dark' : 'btn-outline-secondary'" th:title="${notice.pinned} ? '상단 고정 해제' : '상단 고정 설정'">
                                        <i class="bi bi-pin-angle-fill"></i> <span th:text="${notice.pinned} ? '해제' : '고정'"></span>
                                    </button>
                                </form>
                                <form th:action="@{/admin/notices/{id}/delete(id=${notice.id})}" method="post" onsubmit="return confirm('이 성당소식을 정말 삭제하시겠습니까?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-2"><i class="bi bi-trash"></i> 삭제</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(notices)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <i class="bi bi-megaphone fs-1 d-block mb-3 opacity-50"></i>
                            등록된 성당소식이 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Mobile Card View -->
        <div class="d-block d-md-none">
            <div th:each="notice : ${notices}" class="card mb-3 border-0 shadow-sm rounded-4" th:classappend="${notice.pinned} ? 'border border-warning' : ''" th:style="${notice.pinned} ? 'background-color: #FFF3CD !important;' : ''">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="mb-0 fw-bold">
                            <span th:if="${notice.pinned}" class="badge bg-danger text-white me-1"><i class="bi bi-pin-angle-fill"></i> 고정</span>
                            <a th:href="@{/notices/{id}(id=${notice.id})}" th:text="${notice.title}" target="_blank" class="text-dark text-decoration-none">제목</a>
                            <span th:if="${notice.attachments != null and not #lists.isEmpty(notice.attachments)}" class="badge bg-light text-dark border ms-1"><i class="bi bi-paperclip"></i></span>
                        </h6>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-end mt-3">
                        <div>
                            <p class="text-muted small mb-1">
                                <i class="bi bi-person me-1"></i>관리자
                                <span class="ms-2"><i class="bi bi-eye me-1"></i><span th:text="${notice.viewCount}">0</span></span>
                            </p>
                            <span th:if="${notice.pinned}" class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 me-1" style="font-size: 0.7rem;"><i class="bi bi-pin-angle-fill"></i> 상단고정</span>
                            <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25" style="font-size: 0.7rem;">정상</span>
                        </div>
                        
                        <div class="text-end d-flex gap-1 justify-content-end">
                            <form th:action="@{/admin/notices/{id}/toggle-pin(id=${notice.id}, page=${currentPage}, keyword=${keyword})}" method="post">
                                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm py-1 px-2 rounded-pill" th:classappend="${notice.pinned} ? 'btn-warning text-dark' : 'btn-outline-secondary'" style="font-size: 0.8rem;">
                                    <i class="bi bi-pin-angle-fill"></i> <span th:text="${notice.pinned} ? '고정해제' : '상단고정'"></span>
                                </button>
                            </form>
                            <form th:action="@{/admin/notices/{id}/delete(id=${notice.id})}" method="post" onsubmit="return confirm('이 성당소식을 정말 삭제하시겠습니까?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm btn-outline-danger py-1 px-3 rounded-pill" style="font-size: 0.8rem;"><i class="bi bi-trash"></i> 삭제</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(notices)}" class="text-center py-5 text-muted bg-white rounded-4 shadow-sm border-0">
                <i class="bi bi-megaphone fs-1 d-block mb-3 opacity-50"></i>
                등록된 성당소식이 없습니다.
            </div>
        </div>
    </div>

    <!-- 페이징 -->
    <nav class="mt-4" th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/admin/notices(page=${currentPage - 1}, keyword=${keyword})}"><i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link border-0 rounded-circle mx-1" th:classappend="${i == currentPage} ? 'bg-primary text-white' : 'text-dark'" th:href="@{/admin/notices(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/admin/notices(page=${currentPage + 1}, keyword=${keyword})}"><i class="bi bi-chevron-right"></i></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
