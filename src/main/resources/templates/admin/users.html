<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:replace="~{admin/layout :: layout(~{::content})}">
<head><title>회원 관리</title><meta name="csrf-token" th:content="${csrfToken}">
<script src="/js/csrf.js"></script>
</head>
<body>
<div th:fragment="content">
    <div class="page-header">
        <h2 class="page-title"><i class="bi bi-people-fill text-warning me-2"></i> 회원 관리</h2>
        
        <!-- 검색 폼 -->
        <form class="d-flex" action="/admin/users" method="get" style="width: 300px;">
            <div class="input-group">
                <input class="form-control" type="search" name="keyword" placeholder="이름 또는 아이디 검색" aria-label="Search" th:value="${keyword}">
                <button class="btn btn-outline-secondary bg-white" type="submit"><i class="bi bi-search"></i></button>
            </div>
        </form>
    </div>
    
    <!-- 비밀번호 초기화 알림창 -->
    <div th:if="${resetPasswordSuccess}" class="alert alert-warning alert-dismissible fade show shadow-sm border-0 rounded-3 mb-4" role="alert">
        <div class="d-flex align-items-center">
            <i class="bi bi-key-fill fs-2 text-warning me-3"></i>
            <div>
                <h5 class="alert-heading mb-1 fw-bold text-dark">비밀번호가 초기화되었습니다.</h5>
                <p class="mb-1 text-secondary">
                    대상 회원: <strong class="text-dark" th:text="${resetUserName} + ' (' + ${resetUsername} + ')'">홍길동 (user1)</strong> |
                    임시 비밀번호: <code id="tempPasswordVal" class="fs-6 fw-bold text-danger px-2 py-1 bg-white rounded border border-warning" th:text="${tempPassword}">sc7mK9#x</code>
                    <button type="button" class="btn btn-sm btn-outline-dark ms-2 py-0 px-2" onclick="navigator.clipboard.writeText(document.getElementById('tempPasswordVal').innerText); alert('임시 비밀번호가 클립보드에 복사되었습니다.');"><i class="bi bi-clipboard me-1"></i>복사</button>
                </p>
                <small class="text-muted">※ 신자분께 위 임시 비밀번호를 전달해 주세요. 로그인 후 비밀번호를 즉시 변경하도록 안내하시기 바랍니다.</small>
            </div>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- 오류 메시지 알림창 -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm border-0 rounded-3 mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">오류 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="admin-card p-md-4 p-2 bg-transparent bg-md-white border-0 border-md shadow-none shadow-md-sm">
        <div class="table-responsive d-none d-md-block bg-white rounded-3 border overflow-hidden">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="py-3">이름(세례명) / 구역</th>
                        <th class="py-3">아이디</th>
                        <th class="py-3">가입일</th>
                        <th class="py-3 text-center">상태</th>
                        <th class="py-3 text-center">권한 변경</th>
                        <th class="py-3 text-end">관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users}" th:classappend="${user.delYn == 'Y'} ? 'opacity-50' : ''">
                        <td>
                            <span class="fw-bold text-dark" th:text="${user.name}">홍길동</span>
                            <span class="text-muted ms-1 small" th:text="'(' + ${user.baptismalName} + ')'">(세례명)</span>
                            <div th:if="${user.district != null and !user.district.isEmpty()}" class="mt-1">
                                <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25" th:text="${user.district}">1구역</span>
                            </div>
                        </td>
                        <td th:text="${user.username}">user1</td>
                        <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-28</td>
                        <td class="text-center">
                            <span th:if="${user.delYn == 'Y'}" class="badge bg-secondary">삭제됨</span>
                            <span th:if="${user.delYn == 'N' && user.approved}" class="badge bg-success">승인됨</span>
                            <span th:if="${user.delYn == 'N' && !user.approved}" class="badge bg-danger">대기중</span>
                        </td>
                        <td class="text-center">
                            <form th:if="${user.delYn == 'N'}" th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-inline-flex align-items-center"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <select name="role" class="form-select form-select-sm me-2" style="width: 100px;">
                                    <option value="USER" th:selected="${user.role == 'USER'}">일반</option>
                                    <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">관리자</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary py-1 px-2">변경</button>
                            </form>
                            <span th:if="${user.delYn == 'Y'}" class="text-muted small" th:text="${user.role}"></span>
                        </td>
                        <td class="text-end">
                            <form th:if="${user.delYn == 'N' && !user.approved}" th:action="@{/admin/users/{id}/approve(id=${user.id})}" method="post" class="d-inline"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm btn-success"><i class="bi bi-check-circle me-1"></i>승인</button>
                            </form>
                            <form th:if="${user.delYn == 'N'}" th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirm('정말로 이 회원의 비밀번호를 임시 비밀번호로 초기화하시겠습니까?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm btn-outline-warning text-dark ms-1" title="비밀번호 초기화"><i class="bi bi-key-fill"></i> 초기화</button>
                            </form>
                            <form th:if="${user.delYn == 'N'}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" class="d-inline" onsubmit="return confirm('정말로 이 회원을 강제 탈퇴 처리하시겠습니까?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm btn-outline-danger ms-1" title="회원 탈퇴"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(users)}">
                        <td colspan="6" class="text-center py-5 text-muted">
                            <i class="bi bi-person-x fs-1 d-block mb-3 opacity-50"></i>
                            조회된 회원이 없습니다.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <!-- Mobile Card View -->
        <div class="d-block d-md-none">
            <div th:each="user : ${users}" class="card mb-3 border-0 shadow-sm rounded-4" th:classappend="${user.delYn == 'Y'} ? 'opacity-50' : ''">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <div>
                            <h6 class="mb-0 fw-bold d-inline-block">
                                <span th:text="${user.name}">홍길동</span>
                            </h6>
                            <span class="text-muted small ms-1" th:text="'(' + ${user.baptismalName} + ')'">(세례명)</span>
                            <div th:if="${user.district != null and !user.district.isEmpty()}" class="mt-1 d-inline-block ms-1">
                                <span class="badge bg-secondary bg-opacity-10 text-secondary border border-secondary border-opacity-25" th:text="${user.district}">1구역</span>
                            </div>
                            <div class="text-muted small mt-1"><i class="bi bi-person-badge me-1"></i><span th:text="${user.username}">아이디</span></div>
                        </div>
                        <div>
                            <span th:if="${user.delYn == 'Y'}" class="badge bg-secondary">삭제됨</span>
                            <span th:if="${user.delYn == 'N' && user.approved}" class="badge bg-success">승인됨</span>
                            <span th:if="${user.delYn == 'N' && !user.approved}" class="badge bg-danger">대기중</span>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-between align-items-end mt-3 border-top pt-2">
                        <div>
                            <form th:if="${user.delYn == 'N'}" th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="d-flex align-items-center"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <select name="role" class="form-select form-select-sm me-1" style="width: 80px; font-size: 0.8rem; padding: 2px 5px;">
                                    <option value="USER" th:selected="${user.role == 'USER'}">일반</option>
                                    <option value="ADMIN" th:selected="${user.role == 'ADMIN'}">관리자</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-outline-primary" style="font-size: 0.75rem; padding: 2px 8px;">변경</button>
                            </form>
                            <span th:if="${user.delYn == 'Y'}" class="text-muted small" th:text="${user.role}"></span>
                        </div>
                        
                        <div class="text-end">
                            <form th:if="${user.delYn == 'N' && !user.approved}" th:action="@{/admin/users/{id}/approve(id=${user.id})}" method="post" class="d-inline"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm btn-success rounded-pill" style="font-size: 0.8rem; padding: 2px 10px;"><i class="bi bi-check-circle me-1"></i>승인</button>
                            </form>
                            <form th:if="${user.delYn == 'N'}" th:action="@{/admin/users/{id}/reset-password(id=${user.id})}" method="post" class="d-inline ms-1" onsubmit="return confirm('정말로 이 회원의 비밀번호를 임시 비밀번호로 초기화하시겠습니까?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm btn-outline-warning text-dark rounded-pill px-2 py-1" style="font-size: 0.8rem;" title="비밀번호 초기화"><i class="bi bi-key-fill"></i> 초기화</button>
                            </form>
                            <form th:if="${user.delYn == 'N'}" th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post" class="d-inline ms-1" onsubmit="return confirm('정말로 이 회원을 강제 탈퇴 처리하시겠습니까?');"><input type="hidden" name="_csrf" th:value="${csrfToken}">
                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-2 py-1"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(users)}" class="text-center py-5 text-muted bg-white rounded-4 shadow-sm border-0">
                <i class="bi bi-person-x fs-1 d-block mb-3 opacity-50"></i>
                조회된 회원이 없습니다.
            </div>
        </div>
    </div>

    <!-- 페이징 -->
    <nav class="mt-4" th:if="${totalPages > 0}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword})}"><i class="bi bi-chevron-left"></i></a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link border-0 rounded-circle mx-1" th:classappend="${i == currentPage} ? 'bg-primary text-white' : 'text-dark'" th:href="@{/admin/users(page=${i}, keyword=${keyword})}" th:text="${i + 1}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link border-0 text-dark" th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword})}"><i class="bi bi-chevron-right"></i></a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
