<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 천주교 서창동성당</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --primary-navy: #0F172A;
            --accent-gold: #D97706;
            --accent-gold-light: #F59E0B;
            --bg-light: #F8FAFC;
            --text-main: #1E293B;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .signup-card {
            background: #FFFFFF;
            border-radius: 24px;
            border: 1px solid #E2E8F0;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 44px 36px;
        }

        .brand-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-navy);
            text-decoration: none;
            display: inline-block;
            margin-bottom: 20px;
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
            color: #FFFFFF;
            font-weight: 600;
            padding: 12px;
            border-radius: 12px;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
        }

        .btn-gold:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            color: #FFFFFF;
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #CBD5E1;
        }

        .form-control:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.15);
        }

        @media (max-width: 576px) {
            body {
                padding: 20px 12px;
            }
            .signup-card {
                padding: 30px 20px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>


<div class="signup-card text-center">
    <a href="/" class="brand-logo">
        <span style="color: var(--accent-gold);">†</span> 서창동성당
    </a>
    <h4 class="fw-bold mb-1">교우 회원가입</h4>
    <p class="text-secondary small mb-4">서창동성당 공동체의 식구가 되어주세요</p>

    <!-- Error Alert -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show text-start small mb-4" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">오류 메시지</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form action="/signup" method="post" class="text-start" onsubmit="return validateForm()">
        <div class="mb-3">
            <label for="username" class="form-label small fw-semibold">아이디 <span class="text-danger">*</span></label>
            <input type="text" id="username" name="username" class="form-control" placeholder="아이디를 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label small fw-semibold">비밀번호 <span class="text-danger">*</span></label>
            <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요" required>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label small fw-semibold">비밀번호 확인 <span class="text-danger">*</span></label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="비밀번호를 한번 더 입력하세요" required>
            <div id="passwordMismatch" class="text-danger small mt-1" style="display: none;">비밀번호가 일치하지 않습니다.</div>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <label for="name" class="form-label small fw-semibold">성명 (이름) <span class="text-danger">*</span></label>
                <input type="text" id="name" name="name" class="form-control" placeholder="예: 홍길동" required>
            </div>
            <div class="col-md-6">
                <label for="baptismalName" class="form-label small fw-semibold">세례명 <span class="text-muted">(선택)</span></label>
                <input type="text" id="baptismalName" name="baptismalName" class="form-control" placeholder="예: 바오로">
            </div>
        </div>

        <div class="row g-2 mb-4">
            <div class="col-md-6">
                <label for="email" class="form-label small fw-semibold">이메일 주소 <span class="text-muted">(선택)</span></label>
                <input type="email" id="email" name="email" class="form-control" placeholder="example@email.com">
            </div>
            <div class="col-md-6">
                <label for="district" class="form-label small fw-semibold">구역 <span class="text-muted">(선택)</span></label>
                <input type="text" id="district" name="district" class="form-control" placeholder="예: 1구역">
            </div>
        </div>

        <button type="submit" class="btn btn-gold mb-3">회원가입 완료</button>
    </form>

    <div class="pt-3 border-top d-flex justify-content-between align-items-center small">
        <span class="text-secondary">이미 계정이 있으신가요?</span>
        <a href="/login" class="fw-bold text-decoration-none" style="color: var(--accent-gold);">로그인 하기 <i class="bi bi-arrow-right"></i></a>
    </div>

    <div class="mt-4 pt-2">
        <a href="/" class="text-secondary text-decoration-none small"><i class="bi bi-house me-1"></i> 메인으로 돌아가기</a>
    </div>
</div>

<script>
    function validateForm() {
        const pw = document.getElementById("password").value;
        const confirmPw = document.getElementById("confirmPassword").value;
        const mismatchDiv = document.getElementById("passwordMismatch");

        if (pw !== confirmPw) {
            mismatchDiv.style.display = "block";
            return false;
        } else {
            mismatchDiv.style.display = "none";
            return true;
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
