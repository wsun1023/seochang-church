<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 알림 - 천주교 서창동성당</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; color: #1e293b; font-family: system-ui, sans-serif; }
        .notification-main { max-width: 880px; margin: 112px auto 60px; padding: 0 20px; }
        .notification-card { border: 1px solid #e2e8f0; border-radius: 20px; background: white; overflow: hidden; }
        .notification-item { padding: 24px; border-bottom: 1px solid #e2e8f0; }
        .notification-item:last-child { border-bottom: 0; }
        .notification-item.unread { background: #f0f7ff; border-left: 4px solid #2563eb; padding-left: 20px; }
        .notification-open { padding: 0; border: 0; background: transparent; color: #1e293b; text-align: left; line-height: 1.7; overflow-wrap: anywhere; }
        .notification-open:hover { text-decoration: underline; color: #1d4ed8; }
        .notification-open:focus-visible { outline: 2px solid #2563eb; outline-offset: 4px; }
        .notification-empty { padding: 72px 24px; text-align: center; color: #64748b; }
        .notification-empty i { font-size: 2.5rem; color: #94a3b8; }
        @media (max-width: 575px) { .notification-main { margin-top: 96px; padding: 0 14px; } .notification-item { padding: 20px 16px; } .notification-item.unread { padding-left: 12px; } }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="notification-main">
    <header class="mb-4">
        <p class="text-secondary small mb-2">서창동성당 · 내 소식</p>
        <h1 class="h2 fw-bold">알림</h1>
        <p class="text-secondary mb-0">읽지 않은 알림 <strong class="text-primary" th:text="${unreadCount}">0</strong>개가 있습니다.</p>
    </header>
    <div th:if="${notificationMessage != null}" class="alert alert-info" role="status" th:text="${notificationMessage}"></div>
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <nav class="btn-group" aria-label="알림 필터">
            <a th:href="@{/notifications}" class="btn" th:classappend="${!unreadOnly ? 'btn-dark' : 'btn-outline-secondary'}" th:attr="aria-current=${!unreadOnly ? 'page' : null}">전체</a>
            <a th:href="@{/notifications(unreadOnly=true)}" class="btn" th:classappend="${unreadOnly ? 'btn-dark' : 'btn-outline-secondary'}" th:attr="aria-current=${unreadOnly ? 'page' : null}">읽지 않음</a>
        </nav>
        <form th:action="@{/notifications/read-all}" method="post">
            <input type="hidden" name="_csrf" th:value="${csrfToken}">
            <button class="btn btn-outline-secondary btn-sm" th:disabled="${unreadCount == 0}"><i class="bi bi-check2-all" aria-hidden="true"></i> 모두 읽음</button>
        </form>
    </div>
    <section class="notification-card" aria-label="알림 목록">
        <div th:if="${notificationPage.empty}" class="notification-empty">
            <i class="bi bi-bell" aria-hidden="true"></i>
            <h2 class="h5 mt-3" th:text="${unreadOnly ? '읽지 않은 알림이 없습니다.' : '아직 알림이 없습니다.'}"></h2>
            <p class="small mb-0">새 공지와 댓글·답글, 회원 승인 소식을 이곳에서 확인하세요.</p>
        </div>
        <article th:each="notification : ${notificationPage.content}" class="notification-item" th:classappend="${!notification.read ? 'unread' : ''}">
            <div class="d-flex align-items-center flex-wrap gap-2 mb-2">
                <span class="badge bg-secondary-subtle text-dark" th:text="${notification.type.label}"></span>
                <span th:unless="${notification.read}" class="badge bg-primary">새 알림</span>
                <time class="small text-secondary ms-auto" th:datetime="${notification.createdAt}" th:text="${#temporals.format(notification.createdAt, 'yyyy.MM.dd HH:mm')}"></time>
            </div>
            <form th:action="@{/notifications/{id}/open(id=${notification.id})}" method="post">
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <button class="notification-open" th:text="${notification.message}"></button>
            </form>
            <form th:unless="${notification.read}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post" class="mt-2">
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <button class="btn btn-sm btn-link text-secondary p-0">읽음 처리</button>
            </form>
        </article>
    </section>
    <nav class="d-flex justify-content-center align-items-center gap-3 mt-4" aria-label="알림 페이지" th:if="${notificationPage.totalPages > 1}">
        <a th:if="${notificationPage.hasPrevious()}" th:href="@{/notifications(page=${notificationPage.number - 1},unreadOnly=${unreadOnly})}" class="btn btn-outline-secondary btn-sm">이전</a>
        <span class="small text-secondary" th:text="|${notificationPage.number + 1} / ${notificationPage.totalPages}|"></span>
        <a th:if="${notificationPage.hasNext()}" th:href="@{/notifications(page=${notificationPage.number + 1},unreadOnly=${unreadOnly})}" class="btn btn-outline-secondary btn-sm">다음</a>
    </nav>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
