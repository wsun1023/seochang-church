<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원정보 수정 - 서창동성당</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; color: #1e293b; }
        main { max-width: 720px; margin: 110px auto 48px; padding: 0 16px; }
        .profile-panel { background: white; border: 1px solid #e2e8f0; border-radius: 20px; padding: clamp(20px, 4vw, 36px); }
        .form-label { font-weight: 600; }
    </style>
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main>
<section th:fragment="profileForm">
    <h1 class="h3 fw-bold mb-2">회원정보 수정</h1>
    <p class="text-secondary mb-4">변경할 정보를 입력하고 현재 비밀번호로 확인해주세요.</p>
    <div th:if="${success}" class="alert alert-success" role="status" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
    <form th:action="@{${profileAction}}" method="post" class="profile-panel">
        <input type="hidden" name="_csrf" th:value="${csrfToken}">
        <div class="mb-3"><label for="username" class="form-label">아이디</label>
            <input id="username" class="form-control" th:value="${profile.username}" readonly autocomplete="username">
            <div class="form-text">아이디는 변경할 수 없습니다.</div></div>
        <div class="mb-3"><label for="name" class="form-label">이름</label>
            <input id="name" name="name" class="form-control" th:value="${profile.name}" required maxlength="255" autocomplete="name"></div>
        <div class="row">
            <div class="col-md-6 mb-3"><label for="baptismalName" class="form-label">세례명 <small class="text-secondary">(선택)</small></label>
                <input id="baptismalName" name="baptismalName" class="form-control" th:value="${profile.baptismalName}" maxlength="255"></div>
            <div class="col-md-6 mb-3"><label for="district" class="form-label">구역 <small class="text-secondary">(선택)</small></label>
                <input id="district" name="district" class="form-control" th:value="${profile.district}" maxlength="255" placeholder="예: 1구역"></div>
        </div>
        <div class="mb-4"><label for="email" class="form-label">이메일 <small class="text-secondary">(선택)</small></label>
            <input type="email" id="email" name="email" class="form-control" th:value="${profile.email}" maxlength="255" autocomplete="email"></div>
        <fieldset class="border-top pt-3">
            <legend class="h6 fw-bold">비밀번호 변경 <small class="text-secondary">(선택)</small></legend>
            <p class="form-text">변경할 때만 새 비밀번호를 입력하세요. 8자 이상이며 영문·숫자 기준 최대 72자입니다.</p>
            <div class="mb-3"><label for="newPassword" class="form-label">새 비밀번호</label>
                <input type="password" id="newPassword" name="newPassword" class="form-control" minlength="8" maxlength="72" autocomplete="new-password"></div>
            <div class="mb-4"><label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" maxlength="72" autocomplete="new-password"></div>
        </fieldset>
        <div class="border-top pt-3 mb-4"><label for="currentPassword" class="form-label">현재 비밀번호</label>
            <input type="password" id="currentPassword" name="currentPassword" class="form-control" required autocomplete="current-password"></div>
        <div class="d-flex justify-content-end gap-2">
            <a th:href="${profileAction == '/admin/profile' ? '/admin' : '/'}" class="btn btn-outline-secondary rounded-pill px-4">취소</a>
            <button class="btn btn-dark rounded-pill px-4" type="submit">변경사항 저장</button>
        </div>
    </form>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
