<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성당 일정 - 서창동성당</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8FAFC;
        }
        .page-header {
            background: linear-gradient(135deg, #0F172A, #1E293B);
            color: white;
            padding: 120px 0 50px;
            margin-bottom: 40px;
            border-radius: 0 0 24px 24px;
            text-align: center;
        }
        @media (max-width: 767.98px) {
            .page-header {
                padding: 90px 0 30px;
                border-radius: 0 0 16px 16px;
            }
            .fc-toolbar-title {
                font-size: 1.15rem !important;
            }
            .fc-dayGridMonth-button, .fc-timeGridWeek-button, .fc-listMonth-button {
                display: none !important;
            }
            .fc .fc-toolbar.fc-header-toolbar {
                margin-bottom: 1em !important;
            }
        }
        #calendar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .fc-event {
            cursor: pointer;
        }
        .ical-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-header">
    <div class="container">
        <h2 class="fw-bold mb-2">성당 일정</h2>
        <p class="text-white-50 mb-0">서창동성당의 주요 전례 및 행사 일정을 확인하세요.</p>
    </div>
</div>

<div class="container mb-5">
    <div class="row">
        <div class="col-lg-3 mb-4 order-2 order-lg-1 d-flex flex-column">
            <div class="ical-box order-2 order-lg-1">
                <h6 class="fw-bold"><i class="bi bi-calendar-check me-2 text-primary"></i>외부 캘린더 구독</h6>
                <p class="small text-muted mb-2">아래 주소를 복사하여 스마트폰이나 구글 캘린더에서 성당 일정을 구독할 수 있습니다.</p>
                <div class="input-group input-group-sm">
                    <input type="text" class="form-control" id="icalUrl" readonly>
                    <button class="btn btn-outline-secondary" type="button" onclick="copyIcalUrl()">복사</button>
                </div>
            </div>
            
            <div class="ical-box order-1 order-lg-2">
                <h6 class="fw-bold mb-3"><i class="bi bi-palette me-2 text-warning"></i>일정 범례</h6>
                <div class="d-flex align-items-center mb-2">
                    <span style="display:inline-block; width:12px; height:12px; background-color:#3788d8; border-radius:50%; margin-right:8px;"></span>
                    <span class="small">미사 / 전례</span>
                </div>
                <div class="d-flex align-items-center mb-2">
                    <span style="display:inline-block; width:12px; height:12px; background-color:#28a745; border-radius:50%; margin-right:8px;"></span>
                    <span class="small">행사 / 모임</span>
                </div>
                <div class="d-flex align-items-center mb-2">
                    <span style="display:inline-block; width:12px; height:12px; background-color:#dc3545; border-radius:50%; margin-right:8px;"></span>
                    <span class="small">기타 / 공지</span>
                </div>
            </div>
        </div>
        
        <div class="col-lg-9 order-1 order-lg-2">
            <div id="calendar"></div>
        </div>
    </div>
</div>

<!-- Event Detail Modal -->
<div class="modal fade" id="eventModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="eventTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-1 text-muted small"><i class="bi bi-clock me-1"></i> <span id="eventTime"></span></p>
                <hr>
                <div id="eventDescription" style="white-space: pre-wrap;"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const calendarEl = document.getElementById('calendar');
        const eventModal = new bootstrap.Modal(document.getElementById('eventModal'));

        const calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'dayGridMonth',
            contentHeight: 'auto',
            locale: 'ko',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,listMonth'
            },
            buttonText: {
                today: '오늘',
                month: '월',
                week: '주',
                list: '목록'
            },
            events: '/api/calendar/events',
            eventClick: function(info) {
                document.getElementById('eventTitle').textContent = info.event.title;
                
                let timeStr = '';
                if(info.event.allDay) {
                    timeStr = '종일';
                } else {
                    timeStr = info.event.start.toLocaleString();
                    if(info.event.end) {
                        timeStr += ' ~ ' + info.event.end.toLocaleString();
                    }
                }
                document.getElementById('eventTime').textContent = timeStr;
                
                const desc = info.event.extendedProps.description;
                document.getElementById('eventDescription').textContent = desc ? desc : '내용이 없습니다.';
                
                eventModal.show();
            }
        });

        calendar.render();
        
        // Set iCal URL dynamically
        const icalUrlInput = document.getElementById('icalUrl');
        const currentUrl = window.location.origin;
        icalUrlInput.value = currentUrl + '/api/calendar/ical';
    });
    
    function copyIcalUrl() {
        const copyText = document.getElementById("icalUrl");
        copyText.select();
        copyText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(copyText.value).then(() => {
            alert("iCal 주소가 복사되었습니다. 캘린더 앱에서 'URL로 추가'를 선택하세요.");
        });
    }
</script>

</body>
</html>
