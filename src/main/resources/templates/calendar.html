<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성당 일정 - 서창동성당</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #F8FAFC;
        }
        .page-header {
            background: linear-gradient(135deg, #0F172A, #1E293B);
            color: white;
            padding: 120px 0 50px;
            margin-bottom: 40px;
            border-radius: 0 0 24px 24px;
            text-align: center;
        }
        @media (max-width: 767.98px) {
            .page-header {
                padding: 90px 0 30px;
                border-radius: 0 0 16px 16px;
            }
            .fc-toolbar-title {
                font-size: 1.15rem !important;
            }
            .fc-dayGridMonth-button, .fc-timeGridWeek-button, .fc-listMonth-button {
                display: none !important;
            }
            .fc .fc-toolbar.fc-header-toolbar {
                margin-bottom: 1em !important;
            }
        }
        #calendar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .fc-event {
            cursor: pointer;
        }
        .ical-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
    </style>
<meta name="csrf-token" th:content="${csrfToken}">
<script src="/js/csrf.js"></script>
<link rel="stylesheet" th:href="@{/css/calendar.css}">
</head>
<body class="church-calendar-page">

<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-header">
    <div class="container">
        <h2 class="fw-bold mb-2">성당 일정</h2>
        <p class="text-white-50 mb-0">서창동성당의 주요 전례 및 행사 일정을 확인하세요.</p>
    </div>
</div>

<main class="container calendar-main mb-5">
    <section th:fragment="calendarPanel" class="calendar-panel" aria-label="성당 일정 달력">
        <div class="calendar-toolbar">
            <div class="calendar-month-navigation">
                <h2 id="calendarTitle" aria-live="polite">성당 일정</h2>
                <div class="calendar-date-buttons">
                    <button type="button" id="calendarPrevious" aria-label="이전 기간"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
                    <button type="button" id="calendarToday">오늘</button>
                    <button type="button" id="calendarNext" aria-label="다음 기간"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
                </div>
            </div>
            <div class="calendar-view-switch" role="group" aria-label="달력 보기 방식">
                <button type="button" data-calendar-view="dayGridMonth" aria-pressed="true">월간</button>
                <button type="button" data-calendar-view="timeGridWeek" aria-pressed="false">주간</button>
                <button type="button" data-calendar-view="listMonth" aria-pressed="false"><i class="bi bi-list-ul" aria-hidden="true"></i>목록</button>
            </div>
        </div>
        <div class="calendar-filter-bar">
            <div class="calendar-filters" role="group" aria-label="일정 분류 필터">
                <button type="button" data-calendar-category="all" aria-pressed="true">전체</button>
                <button type="button" data-calendar-category="mass" aria-pressed="false"><span class="calendar-dot calendar-dot-mass" aria-hidden="true"></span>미사·전례</button>
                <button type="button" data-calendar-category="meeting" aria-pressed="false"><span class="calendar-dot calendar-dot-meeting" aria-hidden="true"></span>행사·모임</button>
                <button type="button" data-calendar-category="other" aria-pressed="false"><span class="calendar-dot calendar-dot-other" aria-hidden="true"></span>기타·공지</button>
            </div>
            <span id="calendarCount" class="calendar-count" aria-live="polite"></span>
        </div>
        <p id="calendarLoading" class="calendar-status" role="status" hidden>일정을 불러오고 있어요.</p>
        <div id="calendarError" class="alert alert-warning" role="alert" hidden>일정을 불러오지 못했습니다. <button type="button" id="calendarRetry" class="btn btn-sm btn-outline-dark">다시 시도</button></div>
        <div id="calendar"></div>
        <p class="calendar-help"><i class="bi bi-hand-index-thumb" aria-hidden="true"></i> 일정을 누르면 자세한 내용을 볼 수 있어요.</p>
    </section>
    <aside th:fragment="calendarSubscription" class="calendar-subscribe" aria-labelledby="calendarSubscribeTitle">
        <div class="calendar-subscribe-icon"><i class="bi bi-calendar2-plus" aria-hidden="true"></i></div>
        <div class="calendar-subscribe-copy"><h2 id="calendarSubscribeTitle">내 캘린더에서도 만나요</h2><p>구독 주소를 스마트폰·구글 캘린더에 추가하면 성당 일정을 함께 확인할 수 있어요.</p></div>
        <div class="calendar-subscribe-action">
            <label for="icalUrl" class="visually-hidden">성당 일정 구독 주소</label><input type="text" id="icalUrl" readonly>
            <button type="button" id="copyIcalUrl"><i class="bi bi-copy" aria-hidden="true"></i>주소 복사</button>
        </div>
        <p id="calendarCopyStatus" class="calendar-copy-status" role="status"></p>
    </aside>
</main>

<!-- Event Detail Modal -->
<div th:fragment="eventDetail" class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content calendar-event-modal">
            <div class="modal-header">
                <div><span id="eventCategory" class="calendar-category-label"></span><h5 class="modal-title fw-bold mt-2" id="eventTitle"></h5></div>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="일정 상세 닫기"></button>
            </div>
            <div class="modal-body">
                <p class="calendar-event-time"><i class="bi bi-clock" aria-hidden="true"></i><span id="eventTime"></span></p>
                <div id="eventDescription" class="calendar-event-description"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/ko.global.min.js"></script>

<script th:src="@{/js/calendar.js}" defer></script>

</body>
</html>
