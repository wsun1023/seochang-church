<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${gallery.id == null ? '사진첩 올리기' : '사진첩 수정'} + ' - 서창동성당'"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/toastui/dist/toastui-editor.css}">
    <link th:href="@{/css/gallery.css}" rel="stylesheet">
    <link th:href="@{/css/gallery-form.css}" rel="stylesheet">
    <meta name="csrf-token" th:content="${csrfToken}">
    <script src="/js/csrf.js"></script>
<link rel="stylesheet" th:href="@{/css/toastui-mobile.css}">
</head>
<body class="gallery-page gallery-form-page">
<div th:replace="~{fragments/nav :: nav}"></div>
<header class="page-banner">
    <div class="container text-center">
        <h1 class="h2 fw-bold mb-2"><i class="bi bi-images me-2" aria-hidden="true"></i><span th:text="${gallery.id == null ? '새 사진첩' : '사진첩 수정'}">새 사진첩</span></h1>
        <p class="text-white-50 mb-0">함께한 순간을 사진과 이야기로 남겨주세요.</p>
    </div>
</header>
<main class="gallery-form-content container">
    <div class="gallery-form-container">
    <form id="galleryForm" th:action="${gallery.id == null ? '/gallery/new' : '/gallery/' + gallery.id + '/edit'}" method="post" enctype="multipart/form-data"
          th:data-cover-key="${gallery.coverPhoto != null ? 'existing:' + gallery.coverPhoto.id : ''}">
        <input type="hidden" name="_csrf" th:value="${csrfToken}">
        <section class="mb-4" aria-label="사진첩 정보">
            <div class="mb-4">
                <label for="title" class="form-label">제목 <span class="text-danger" aria-hidden="true">*</span></label>
                <input class="form-control" id="title" name="title" maxlength="255" th:value="${gallery.title}" placeholder="사진첩 제목을 입력하세요." required>
            </div>
            <label for="galleryStoryEditor" class="form-label">사진첩 이야기 <span class="text-danger" aria-hidden="true">*</span></label>
            <div id="galleryStoryEditor" aria-label="사진첩 이야기 편집기"></div>
            <input type="hidden" id="content" name="content" th:value="${gallery.content}">
        </section>
        <section class="mb-4" aria-labelledby="photosTitle">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h2 id="photosTitle" class="form-label mb-0"><label for="imageFiles">사진 첨부 <span class="text-danger" aria-hidden="true">*</span> <span class="text-muted small fw-normal">(최대 50장)</span></label></h2>
                <span class="gallery-photo-count" aria-live="polite"><span id="photoCount" th:text="${gallery.photos.size()}">0</span> / 50장</span>
            </div>
            <input type="file" id="imageFiles" name="imageFiles" accept="image/*" multiple class="form-control mb-3" aria-describedby="photoHelp">
            <p id="photoHelp" class="small text-secondary">사진을 누르면 크게 볼 수 있습니다. 화살표로 순서를 바꾸고 대표 사진을 선택하세요. 삭제는 저장할 때 반영됩니다.</p>
            <div id="photoGrid" class="gallery-photo-grid">
                <article th:each="photo : ${gallery.photos}" class="gallery-photo-card" th:data-id="${photo.id}" th:data-url="${photo.filePath}" th:data-name="${photo.originalFileName}">
                    <img th:src="${photo.filePath}" th:alt="${photo.originalFileName}" loading="lazy">
                    <p class="small p-2 mb-0 text-truncate" th:text="${photo.originalFileName}"></p>
                </article>
            </div>
            <p id="photoEmpty" class="gallery-empty" th:hidden="${!gallery.photos.empty}"><i class="bi bi-images d-block fs-1 mb-2" aria-hidden="true"></i>사진을 추가하면 미리보기가 표시됩니다.</p>
            <div id="removedPhotos" class="mt-3" aria-label="삭제 예정 사진"></div>
            <noscript><p class="alert alert-info mt-3">사진 순서 변경과 대표 사진 선택에는 JavaScript가 필요합니다.</p></noscript>
        </section>
        <div id="galleryFeedback" role="alert" class="alert alert-danger mt-3" hidden></div>
        <div id="galleryProgress" class="mt-3" role="status" hidden>
            <label id="galleryProgressLabel" for="uploadProgress" class="small">사진을 준비하고 있습니다.</label>
            <progress id="uploadProgress" class="w-100" max="100" value="0"></progress>
        </div>
        <div class="gallery-form-actions d-flex justify-content-between align-items-center gap-2 pt-3 border-top">
            <a th:href="@{/gallery}" class="btn btn-outline-custom">취소</a>
            <button id="saveGallery" type="submit" class="btn btn-custom"><i class="bi bi-check2-circle me-1" aria-hidden="true"></i><span th:text="${gallery.id == null ? '등록하기' : '수정완료'}">등록하기</span></button>
        </div>
    </form>
    </div>
    <dialog id="galleryPhotoPreview" class="gallery-upload-preview" aria-labelledby="galleryPhotoPreviewTitle">
        <div class="gallery-upload-preview-header">
            <h2 id="galleryPhotoPreviewTitle" class="h6 fw-semibold mb-0">사진 미리보기</h2>
            <button id="galleryPhotoPreviewClose" type="button" class="btn-close" aria-label="사진 미리보기 닫기"></button>
        </div>
        <div class="gallery-upload-preview-stage"><img id="galleryPhotoPreviewImage" alt=""></div>
    </dialog>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>
<script th:src="@{/toastui/dist/toastui-editor-all.min.js}"></script>
<script th:src="@{/toastui/dist/i18n/ko-kr.js}"></script>
<script th:src="@{/js/gallery-editor.js}" defer></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('galleryForm');
        const contentInput = document.getElementById('content');
        const editor = new toastui.Editor({
            el: document.getElementById('galleryStoryEditor'),
            height: window.matchMedia('(max-width: 575.98px)').matches ? '360px' : '500px',
            initialEditType: 'wysiwyg',
            previewStyle: window.matchMedia('(max-width: 575.98px)').matches ? 'tab' : 'vertical',
            initialValue: contentInput.value || '',
            language: 'ko-KR',
            placeholder: '행사에서 함께 나누고 싶은 이야기를 적어주세요.',
            toolbarItems: [
                ['heading', 'bold', 'italic', 'strike'],
                ['hr', 'quote'],
                ['ul', 'ol', 'task', 'indent', 'outdent'],
                ['table', 'link'],
                ['code', 'codeblock']
            ]
        });

        const syncContent = function () {
            contentInput.value = editor.getMarkdown();
        };
        editor.on('change', syncContent);
        form.addEventListener('submit', function (event) {
            syncContent();
            if (!contentInput.value.trim()) {
                event.preventDefault();
                event.stopImmediatePropagation();
                editor.focus();
                const feedback = document.getElementById('galleryFeedback');
                feedback.textContent = '사진첩 이야기를 입력해주세요.';
                feedback.hidden = false;
            }
        }, true);
    });
</script>
</body>
</html>
