<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${gallery.id == null ? '사진첩 올리기' : '사진첩 수정'} + ' - 서창동성당'"></title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --primary-navy: #0F172A;
            --accent-gold: #D97706;
            --accent-gold-light: #F59E0B;
            --bg-light: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        .page-banner {
            background: linear-gradient(135deg, var(--primary-navy), #1E293B);
            color: white;
            padding: 120px 0 50px;
            margin-bottom: 40px;
            border-radius: 0 0 24px 24px;
        }

        .form-control:focus {
            border-color: #94A3B8;
            box-shadow: 0 0 0 0.25rem rgba(148, 163, 184, 0.25);
        }
        
        @media (max-width: 768px) {
            .page-banner {
                padding: 90px 0 30px;
                margin-bottom: 25px;
                border-radius: 0 0 16px 16px;
            }
        }

        .image-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .image-preview-item {
            position: relative;
            width: 120px;
            height: 120px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-preview-remove {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(220, 53, 69, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        footer {
            background: var(--primary-navy);
            color: #94A3B8;
            padding: 20px 0;
            margin-top: 40px;
        }

        #uploadOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(5px);
            z-index: 9999;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        
        .progress-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            width: 90%;
            max-width: 500px;
            color: var(--text-main);
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

<!-- Navigation -->
<div th:replace="~{fragments/nav :: nav}"></div>

<!-- Page Banner -->
<div class="page-banner">
    <div class="container text-center">
        <h2 class="fw-bold mb-2"><i class="bi bi-images me-2" style="color: var(--accent-gold-light);"></i>본당 갤러리</h2>
        <p class="text-white-50 mb-0" th:text="${gallery.id == null ? '새로운 행사 사진을 올려보세요.' : '등록된 갤러리를 수정합니다.'}"></p>
    </div>
</div>

<!-- Main Content -->
<main class="container">
    <div class="form-container mx-auto" style="max-width: 800px;">
        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
                
                <h4 class="fw-bold mb-4" th:text="${gallery.id == null ? '사진첩 올리기' : '사진첩 수정'}">글쓰기</h4>
                
                <form class="upload-form" id="galleryForm" data-redirect-url="/gallery" th:action="${gallery.id == null ? '/gallery/new' : '/gallery/' + gallery.id + '/edit'}" method="post" enctype="multipart/form-data">
                    
                    <div class="mb-4">
                        <label for="title" class="form-label fw-medium text-secondary small">제목 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg bg-light" id="title" name="title" th:value="${gallery.title}" placeholder="행사 제목을 입력하세요" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="content" class="form-label fw-medium text-secondary small">내용 <span class="text-danger">*</span></label>
                        <textarea class="form-control bg-light" id="content" name="content" rows="6" placeholder="행사에 대한 간단한 설명을 남겨주세요." required th:text="${gallery.content}"></textarea>
                    </div>
                    
                    <!-- File Uploads -->
                    <div class="mb-4 bg-light p-4 rounded-3 border">
                        <h6 class="fw-bold mb-3"><i class="bi bi-camera me-2 text-primary"></i>사진 업로드 (최대 50개)</h6>
                        <p class="text-muted small mb-3">여러 장의 사진을 선택하여 한 번에 올릴 수 있습니다. (첫 번째 사진이 대표 썸네일이 됩니다)</p>
                        
                        <div class="input-group mb-3">
                            <input type="file" class="form-control" id="imageFiles" name="imageFiles" accept="image/*" multiple th:required="${gallery.id == null}" onchange="previewImages()">
                        </div>
                        
                        <!-- Preview Container -->
                        <div id="imagePreviewContainer" class="image-preview-container"></div>
                        
                        <!-- Edit mode: show existing images -->
                        <div th:if="${gallery.attachments != null and gallery.attachments.size() > 0}" class="mb-4 bg-white p-3 rounded border">
                            <p class="mb-2 fw-medium text-secondary small"><i class="bi bi-images me-1"></i>기존 사진 (수정 시 그대로 유지됩니다)</p>
                            <div class="d-flex flex-wrap gap-2">
                                <th:block th:each="file : ${gallery.attachments}">
                                    <div class="position-relative" th:if="${file.image}">
                                        <img th:src="${file.filePath}" class="rounded border" style="width:80px; height:80px; object-fit:cover;">
                                        <!-- NOTE: Deletion of existing files not fully implemented in UI yet -->
                                    </div>
                                </th:block>
                            </div>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2 mt-5">
                        <a href="/gallery" class="btn btn-light border px-4 rounded-pill">취소</a>
                        <button type="submit" class="btn btn-dark px-4 rounded-pill shadow-sm" id="submitBtn">
                            <i class="bi bi-check-lg me-1"></i> <span th:text="${gallery.id == null ? '등록 완료' : '수정 완료'}">등록 완료</span>
                        </button>
                    </div>
                    
                </form>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <p class="mb-0 text-nowrap" style="font-size: 0.75rem;">Copyright © 2026 천주교 서창동성당. All Rights Reserved.</p>
    </div>
</footer>

<!-- Upload Progress Overlay -->
<div th:replace="~{fragments/upload_progress :: upload_overlay}"></div>

<script>
    function previewImages() {
        const preview = document.getElementById('imagePreviewContainer');
        preview.innerHTML = '';
        const files = document.getElementById('imageFiles').files;
        
        if (files) {
            if (files.length > 50) {
                alert('사진은 최대 50장까지만 선택할 수 있습니다.');
                document.getElementById('imageFiles').value = '';
                return;
            }
            
            Array.from(files).forEach((file, index) => {
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const div = document.createElement('div');
                        div.className = 'image-preview-item';
                        div.innerHTML = `<img src="${e.target.result}" alt="미리보기">`;
                        preview.appendChild(div);
                    }
                    reader.readAsDataURL(file);
                }
            });
        }
    }
</script>

</body>
</html>
