<!-- fragments/upload_progress.html -->
<div th:fragment="upload_overlay">
    <!-- Upload Progress Overlay -->
    <div id="uploadOverlay">
        <div class="progress-box">
            <div class="spinner-border text-primary mb-3" role="status" style="width: 2.5rem; height: 2.5rem;"></div>
            <h5 class="fw-bold mb-3" id="uploadTitleText">업로드 준비 중...</h5>
            <div class="progress mb-2" style="height: 16px; border-radius: 8px;">
                <div id="uploadProgressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-primary" role="progressbar" style="width: 0%;">0%</div>
            </div>
            <p class="text-muted small mb-0 fw-medium" id="uploadStatusText">잠시만 기다려주세요.</p>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/browser-image-compression@2.0.1/dist/browser-image-compression.js"></script>

    <script>
        // AJAX 폼 전송 및 프로그레스 바 제어
        const form = document.querySelector('form.upload-form');
        if(form) {
            form.addEventListener('submit', async function(e) {
                e.preventDefault(); // 기본 폼 제출 방지
                
                const formData = new FormData(form);
                const imgInput = document.getElementById('imageFiles');
                const genInput = document.getElementById('generalFiles');
                
                const imgFiles = imgInput ? imgInput.files : [];
                const genCount = (genInput && genInput.files) ? genInput.files.length : 0;
                const imgCount = imgFiles.length;
                const totalFiles = imgCount + genCount;
                
                const titleText = document.getElementById('uploadTitleText');
                const statusText = document.getElementById('uploadStatusText');
                const progressBar = document.getElementById('uploadProgressBar');
                
                // 파일이 하나라도 있다면 오버레이 표시
                if (totalFiles > 0) {
                    document.getElementById('uploadOverlay').style.display = 'flex';
                    
                    // 1. 이미지 압축 로직 시작
                    if (imgCount > 0) {
                        statusText.innerText = "잠시만 기다려주세요.";
                        
                        // 기존 원본 이미지는 FormData에서 제거
                        formData.delete('imageFiles');
                        
                        const options = {
                            maxSizeMB: 5,
                            maxWidthOrHeight: 1280,
                            useWebWorker: true,
                            initialQuality: 0.85
                        };
                        
                        for (let i = 0; i < imgCount; i++) {
                            const file = imgFiles[i];
                            try {
                                // 진행률 업데이트
                                titleText.innerText = (i + 1) + " / " + totalFiles + "장 업로드 중...";
                                const percent = Math.floor((i / imgCount) * 100);
                                if(progressBar) {
                                    progressBar.style.width = percent + '%';
                                    progressBar.innerText = percent + '%';
                                }
                                
                                const compressedFile = await imageCompression(file, options);
                                formData.append('imageFiles', compressedFile, file.name);
                            } catch (error) {
                                console.error('이미지 압축 오류:', error);
                                formData.append('imageFiles', file, file.name);
                            }
                        }
                        if(progressBar) {
                            progressBar.style.width = '100%';
                            progressBar.innerText = '100%';
                        }
                    }
                } else {
                    document.getElementById('uploadOverlay').style.display = 'flex';
                    if(titleText) titleText.innerText = "업로드 중...";
                    if(statusText) statusText.innerText = "잠시만 기다려주세요.";
                }
                
                const xhr = new XMLHttpRequest();
                xhr.open('POST', form.action, true);
                
                xhr.upload.onprogress = function(e) {
                    if (e.lengthComputable) {
                        const percentComplete = Math.floor((e.loaded / e.total) * 100);
                        
                        if (totalFiles > 0) {
                            if (percentComplete === 100) {
                                if(titleText) titleText.innerText = "업로드 완료!";
                                if(statusText) statusText.innerText = "화면이 이동할 때까지 잠시만 기다려주세요.";
                            }
                        }
                    }
                };
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const redirectUrl = form.getAttribute('data-redirect-url');
                        window.location.href = redirectUrl ? redirectUrl : '/';
                    } else {
                        alert('저장 중 오류가 발생했습니다. (' + xhr.status + ')');
                        document.getElementById('uploadOverlay').style.display = 'none';
                    }
                };
                
                xhr.onerror = function() {
                    alert('네트워크 오류가 발생했습니다.');
                    document.getElementById('uploadOverlay').style.display = 'none';
                };
                
                xhr.send(formData);
            });
        }
    </script>
</div>
