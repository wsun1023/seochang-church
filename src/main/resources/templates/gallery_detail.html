<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${gallery.title} + ' - 서창동성당'">본당 갤러리 상세</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        :root {
            --primary-navy: #0F172A;
            --accent-gold: #D97706;
            --accent-gold-light: #F59E0B;
            --bg-light: #F8FAFC;
            --text-main: #1E293B;
            --text-muted: #64748B;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
        }

        .page-banner {
            background: linear-gradient(135deg, var(--primary-navy), #1E293B);
            color: white;
            padding: 120px 0 50px;
            margin-bottom: 40px;
            border-radius: 0 0 24px 24px;
        }

        .gallery-header {
            border-bottom: 2px solid #0F172A;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        .gallery-content {
            font-size: 1rem;
            line-height: 1.7;
            color: #334155;
            margin-bottom: 40px;
            white-space: pre-wrap;
        }
        
        @media (max-width: 768px) {
            .page-banner {
                padding: 90px 0 30px;
                margin-bottom: 25px;
                border-radius: 0 0 16px 16px;
            }
            .gallery-header h1 {
                font-size: 1.5rem;
            }
        }

        /* Masonry Grid */
        .masonry-grid {
            column-count: 1;
            column-gap: 15px;
        }
        
        @media (min-width: 576px) {
            .masonry-grid { column-count: 2; }
        }
        
        @media (min-width: 992px) {
            .masonry-grid { column-count: 3; }
        }

        .masonry-item {
            break-inside: avoid;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .masonry-item:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Fullscreen Lightbox Modal */
        #lightboxModal {
            background: rgba(0,0,0,0.95);
        }
        
        #lightboxModal .modal-content {
            background: transparent;
            border: none;
        }
        
        .lightbox-img-container {
            height: 85vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .lightbox-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            z-index: 1055;
        }

        .lightbox-nav:hover {
            background: rgba(255,255,255,0.3);
        }

        .lightbox-prev { left: 20px; }
        .lightbox-next { right: 20px; }
        
        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 2rem;
            background: none;
            border: none;
            z-index: 1055;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Comment Section */
        .comment-section {
            border-top: 2px solid #F1F5F9;
            margin-top: 60px;
            padding-top: 30px;
        }
        
        .comment-item {
            padding: 15px 0;
            border-bottom: 1px solid #F1F5F9;
        }
        
        .comment-item:last-child { border-bottom: none; }
        
        .comment-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
        }
        
        .comment-content {
            font-size: 0.95rem;
            color: #334155;
            margin-top: 8px;
        }
        
        .comment-text {
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .comment-secret {
            color: #94A3B8;
            font-style: italic;
        }

        footer {
            background: var(--primary-navy);
            color: #94A3B8;
            padding: 40px 0 30px;
            margin-top: 80px;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<div th:replace="~{fragments/nav :: nav}"></div>

<!-- Page Banner -->
<div class="page-banner">
    <div class="container text-center">
        <h2 class="fw-bold mb-2"><i class="bi bi-images me-2" style="color: var(--accent-gold-light);"></i>본당 갤러리</h2>
        <p class="text-white-50 mb-0">우리 본당의 행사들을 사진으로 만나보세요.</p>
    </div>
</div>

<!-- Main Content -->
<main class="container">
    <div class="gallery-detail-container mx-auto" style="max-width: 1000px;">
        
        <!-- Header -->
        <div class="gallery-header">
            <h1 class="fw-bold mb-3" th:text="${gallery.title}">행사 제목입니다.</h1>
            <div class="d-flex flex-wrap gap-3 text-secondary" style="font-size: 0.9rem;">
                <span><i class="bi bi-person me-1"></i><span th:text="${gallery.writer}">작성자</span></span>
                <span><i class="bi bi-clock me-1"></i><span th:text="${#temporals.format(gallery.createdAt, 'yyyy-MM-dd HH:mm')}">2026-07-28</span></span>
                <span><i class="bi bi-eye me-1"></i>조회 <span th:text="${gallery.viewCount}">0</span></span>
            </div>
        </div>
        
        <!-- Content -->
        <div class="gallery-content" th:text="${gallery.content}">
            본문 내용입니다.
        </div>
        
        <div th:if="${gallery.attachments != null and not #lists.isEmpty(gallery.attachments)}" class="masonry-grid mb-5">
            <th:block th:each="file : ${gallery.attachments}">
                <div th:if="${file.image}" class="masonry-item" onclick="showImageModal(this.querySelector('img').src)">
                    <img th:src="${file.filePath}" alt="행사 사진">
                </div>
            </th:block>
        </div>
        
        <!-- Actions -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <a href="/gallery" class="btn btn-outline-secondary rounded-pill px-4 shadow-sm">
                <i class="bi bi-grid me-1"></i> 목록으로
            </a>
            
            <div th:if="${isAdmin}" class="d-flex gap-2">
                <a th:href="@{/gallery/{id}/edit(id=${gallery.id})}" class="btn btn-outline-primary rounded-pill px-4">
                    <i class="bi bi-pencil me-1"></i> 수정
                </a>
                <form th:action="@{/gallery/{id}/delete(id=${gallery.id})}" method="post" class="d-inline" onsubmit="return confirm('이 사진첩을 정말 삭제하시겠습니까? (복구 불가)');">
                    <button type="submit" class="btn btn-outline-danger rounded-pill px-4">
                        <i class="bi bi-trash me-1"></i> 삭제
                    </button>
                </form>
            </div>
        </div>
        </div>
        
    </div>
</main>

<!-- Image Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-header border-0 pb-0 justify-content-end">
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close" style="filter: invert(1) grayscale(100%) brightness(200%);"></button>
      </div>
      <div class="modal-body text-center pt-0">
        <img id="modalImage" src="" alt="확대된 이미지" class="img-fluid rounded shadow-lg" style="max-height: 85vh;">
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-center">
    <div class="container">
        <p class="mb-0">© 2026 천주교 인천교구 서창동성당. All rights reserved.</p>
    </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    // --- Image Modal Logic ---
    function showImageModal(src) {
        document.getElementById('modalImage').src = src;
        var imageModal = new bootstrap.Modal(document.getElementById('imageModal'));
        imageModal.show();
    }
</script>
</body>
</html>
